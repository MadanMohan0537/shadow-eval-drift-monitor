name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m shadowgauge.cli bridge-demo --output bridge-report.json
      - run: python -m shadowgauge.cli simulate --db demo.db --output report.json --count 200
      - run: python -m shadowgauge.cli prune --db demo.db --now 2027-01-01T00:00:00+00:00 --retention-days 30

